<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dept 12 Flatbed Trucking</title>
<link rel="stylesheet" href="app.css">
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/tesseract.min.js"></script>
</head>
<body>
<div class="header-row">
  <div class="nav-head">
    <button class="hbtn navtoggle" id="navtoggle" title="Toggle menu" aria-label="Toggle menu">&#9776;</button>
  </div>
  <header>
    <div class="brand" aria-label="Dept 12 Flatbed Trucking">
      <span class="brand-mark" id="logo-home"><img src="rexius-logo.png" alt="Rexius"></span>
      <span class="brand-copy"><b>Dept 12</b><span>Flatbed Trucking</span></span>
    </div>
    <div class="gs">
      <input id="gsearch" placeholder="Search" autocomplete="off">
      <div class="gs-res" id="gsearch-results" style="display:none"></div>
    </div>
    <div class="hdr-right">
      <span class="lbl" id="conn"></span>
    </div>
  </header>
</div>
<button id="nav-scrim" aria-label="Close navigation" tabindex="-1"></button>
<div class="fmtbar-row" id="fmtbar-row">
  <div class="fmtbar-navspacer">
    <div class="nav-cycle-controls" id="nav-cycle-controls" aria-label="Cycle through current section">
      <button class="nav-cycle" data-navcycle="-1" aria-label="Previous subsection" title="Previous subsection">&lt;</button>
      <button class="nav-cycle" data-navcycle="1" aria-label="Next subsection" title="Next subsection">&gt;</button>
    </div>
  </div>
  <div class="fmtbar" id="fmtbar"></div>
</div>
<div class="sections" id="sections"></div>
<div class="subs" id="subs"></div>
<div class="body" id="bodywrap">
  <nav id="sidenav" aria-label="Main navigation">
    <div id="sidenav-resize" title="Drag to resize"></div>
    <div class="sidenav-body" id="sidenav-body"></div>
    <div class="sidenav-footer" id="sidenav-footer"></div>
  </nav>
  <aside id="history-panel" aria-hidden="true">
    <div class="history-head"><div><b>History</b><span>Admin only</span></div><button class="hbtn" id="history-close" aria-label="Close history">&times;</button></div>
    <div class="history-body" id="history-body"></div>
  </aside>
  <main id="main"></main>
  <aside id="rail-wrap">
    <div id="rail-resize" title="Drag to resize"></div>
    <div class="rail-hd"><button id="rail-toggle" class="rail-toggle-icon" title="Hide staging">&gt;</button><span class="lbl">Staging</span><span class="lbl n" id="stage-ct">0</span></div>
    <div class="rail-search"><input id="q" placeholder="Filter Staged Loads" autocomplete="off"></div>
    <div class="rail-body" id="rail"></div>
  </aside>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
<div id="toast"></div>
<input type="file" id="file-ratecon" accept=".pdf" style="display:none">
<input type="file" id="file-batch" accept=".pdf" style="display:none">
<input type="file" id="file-doc" accept=".pdf" multiple style="display:none">
<input type="file" id="file-loose" accept=".pdf" style="display:none">
<script src="config.js"></script>
<script src="sheets-push.js"></script>
<script src="supabase-api.js"></script>
<script src="app.js"></script>
</body>
</html>
